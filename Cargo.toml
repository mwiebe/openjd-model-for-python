[workspace]
members = ["rust-bindings"]
resolver = "2"

# ── Local-development overrides (opt-in) ──────────────────────────────
# Redirect the openjd-* crates to a sibling ~/openjd-rs checkout so the
# bindings build against the in-flight Rust workspace instead of crates.io.
# Cargo only honors [patch] at the workspace root, so it lives here rather
# than in rust-bindings/Cargo.toml. Paths are relative to this file.
# Re-comment before committing so CI/published wheels resolve from crates.io.
# [patch.crates-io]
# openjd-expr     = { path = "../openjd-rs/crates/openjd-expr" }
# openjd-model    = { path = "../openjd-rs/crates/openjd-model" }
# openjd-sessions = { path = "../openjd-rs/crates/openjd-sessions" }

# ENV_PARAMS prototype (env-params branch only): build against the sibling
# openjd-rs-ep repository, branch env-params-prototype, pinned to one commit.
# A git rev rather than a path, because other sessions commit to and edit
# that shared checkout's working tree; a path would build whatever is on
# disk. To iterate against the working tree instead, use
#   openjd-model = { path = "../openjd-rs-ep/crates/openjd-model" }  (etc.)
[patch.crates-io]
openjd-expr     = { git = "file:///home/markw/projects/rfc-env-params/openjd-rs-ep", rev = "49b015e39855dd00d6eb6265e8098c40c67ab3af" }
openjd-model    = { git = "file:///home/markw/projects/rfc-env-params/openjd-rs-ep", rev = "49b015e39855dd00d6eb6265e8098c40c67ab3af" }
openjd-sessions = { git = "file:///home/markw/projects/rfc-env-params/openjd-rs-ep", rev = "49b015e39855dd00d6eb6265e8098c40c67ab3af" }
