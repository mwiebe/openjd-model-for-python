[workspace]
members = ["rust-bindings"]
resolver = "2"

# ── Local-development overrides (opt-in) ──────────────────────────────
# Redirect the openjd-* crates to a sibling ~/openjd-rs checkout so the
# bindings build against the in-flight Rust workspace instead of crates.io.
# Cargo only honors [patch] at the workspace root, so it lives here rather
# than in rust-bindings/Cargo.toml. Paths are relative to this file.
# Re-comment before committing so CI/published wheels resolve from crates.io.
# [patch.crates-io]
# openjd-expr     = { path = "../openjd-rs/crates/openjd-expr" }
# openjd-model    = { path = "../openjd-rs/crates/openjd-model" }
# openjd-sessions = { path = "../openjd-rs/crates/openjd-sessions" }

# ENV_PARAMS prototype (env-params branch only): build against the
# env-params-prototype branch of https://github.com/mwiebe/openjd-rs, pinned
# to one pushed commit so that anyone can build this branch. To iterate
# against a local checkout instead, use
#   openjd-model = { path = "../openjd-rs-ep/crates/openjd-model" }  (etc.)
[patch.crates-io]
openjd-expr     = { git = "https://github.com/mwiebe/openjd-rs", rev = "1e68c2bd8cc911e8eb39bf2cbae81de54dcacd2b" }
openjd-model    = { git = "https://github.com/mwiebe/openjd-rs", rev = "1e68c2bd8cc911e8eb39bf2cbae81de54dcacd2b" }
openjd-sessions = { git = "https://github.com/mwiebe/openjd-rs", rev = "1e68c2bd8cc911e8eb39bf2cbae81de54dcacd2b" }
